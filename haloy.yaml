name: glyphtones
server: haloy-api.firu.dev

health_check_path: /health

domains:
  - domain: glyphtones.firu.dev

secret_providers:
  sops:
    prod:
      file: ./secrets.yaml

env:
  - name: DB_CONNECTION_STRING
    from:
      secret: sops:prod:db_conn_string
  - name: GOOGLE_REDIRECT_URL
    value: https://glyphtones.firu.dev/google-callback
  - name: GOOGLE_ID
    from:
      secret: sops:prod:google_id
  - name: GOOGLE_SECRET
    from:
      secret: sops:prod:google_secret
  - name: PRODUCTION
    value: "true"
  - name: RINGTONES_DIR
    value: /sounds
  - name: TOKEN_KEY
    from:
      secret: sops:prod:token_key

volumes:
  - /srv/data/glyphtones:/sounds
